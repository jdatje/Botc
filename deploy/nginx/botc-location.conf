# Alternative: BotC under a sub path of an existing site, e.g. https://example.com/botc/
# Run the app with BASE_PATH=/botc. For its own subdomain, use botc-site.conf instead.
#
# Copy to /etc/nginx/snippets/botc.conf and add one line inside that site's `server { }` block,
# above its `location / { }`:
#
#     include snippets/botc.conf;
#
# Then: sudo nginx -t && sudo systemctl reload nginx
# Change 3004 if you set BOTC_PORT.

location /botc/ {
    proxy_pass http://127.0.0.1:3004;
    # Live game over Socket.IO: pass the WebSocket upgrade.
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # A quiet night phase shouldn't drop the socket.
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
    # Imported script JSON can be a few hundred KB.
    client_max_body_size 1m;
}

# Boardpass sends its events over the Docker network, never through the internet.
location = /botc/boardpass/events {
    return 404;
}

# /botc → /botc/
location = /botc {
    return 301 /botc/;
}

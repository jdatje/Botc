# BotC on its own subdomain: https://botc.maisonbaron.nl/
# Run the app with BASE_PATH empty and PUBLIC_URL=https://botc.maisonbaron.nl in .env (the defaults).
# For a sub path on an existing site, use botc-location.conf instead.
#
# Copy to /etc/nginx/sites-available/botc, link it into sites-enabled, then:
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d botc.maisonbaron.nl
# Change 3004 if you set BOTC_PORT.

server {
    listen 80;
    listen [::]:80;
    server_name botc.maisonbaron.nl;

    # Boardpass sends its events over the Docker network, never through the internet.
    location = /boardpass/events {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:3004;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        client_max_body_size 1m;
    }
}

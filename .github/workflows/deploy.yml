name: CI / Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # ghcr.io needs lowercase names
  IMAGE: ghcr.io/jdatje/botc

jobs:
  check:
    name: Install and check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      - name: Syntax check
        run: for f in server.js lib/*.js public/*.js; do node --check "$f"; done
      - name: Starts and answers /health
        run: |
          PORT=4100 DATA_DIR="$RUNNER_TEMP/botc" node server.js &
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:4100/health && exit 0; sleep 0.5; done
          echo "server did not answer"; exit 1

  image:
    name: Build and push image
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: GIT_SHA=${{ github.sha }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VPS
    needs: image
    # Turn on with the repository variable DEPLOY_ENABLED=true once the secrets below are set:
    #   secrets VPS_HOST, VPS_USER, VPS_SSH_KEY, VPS_KNOWN_HOSTS (and VPS_PORT if it isn't 22).
    #   VPS_KNOWN_HOSTS is either the server's host key fingerprint (SHA256:…, from
    #   ssh-keyscan HOST | ssh-keygen -lf -) or full ssh-keyscan lines.
    # The VPS keeps its own .env in DEPLOY_PATH (default ~/botc); this job never touches it.
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    env:
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || 'botc' }}
      SSH_PORT: ${{ secrets.VPS_PORT || '22' }}
    steps:
      - uses: actions/checkout@v5

      - name: Set up SSH
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          cat > ~/.ssh/config <<EOF
          Host vps
            HostName ${{ secrets.VPS_HOST }}
            User ${{ secrets.VPS_USER }}
            Port $SSH_PORT
            IdentityFile ~/.ssh/id_deploy
            IdentitiesOnly yes
          EOF
          # The server's host key, checked against what you saved, so nobody can pose as the VPS.
          # VPS_KNOWN_HOSTS holds full ssh-keyscan lines, or just a fingerprint (SHA256:…).
          cat > ~/.ssh/saved <<'SAVED'
          ${{ secrets.VPS_KNOWN_HOSTS }}
          SAVED
          sed -i 's/^[[:space:]]*//' ~/.ssh/saved
          if grep -qE '^[^#[:space:]]+ (ssh-|ecdsa-|sk-)' ~/.ssh/saved; then
            grep -v '^#' ~/.ssh/saved > ~/.ssh/known_hosts
            exit 0
          fi
          want=$(grep -oE 'SHA256:[A-Za-z0-9+/=]+' ~/.ssh/saved | head -1)
          [ -n "$want" ] || want=$(grep -oE '[A-Za-z0-9+/]{43}' ~/.ssh/saved | head -1)
          if [ -z "$want" ]; then
            echo "::error::VPS_KNOWN_HOSTS is empty or not a fingerprint. Put the server's SHA256:… in it (ssh-keyscan <VPS_HOST> | ssh-keygen -lf -)."
            exit 1
          fi
          ssh-keyscan -p "$SSH_PORT" -T 15 "${{ secrets.VPS_HOST }}" 2>/dev/null > ~/.ssh/scanned
          found=$(ssh-keygen -lf ~/.ssh/scanned 2>/dev/null | awk '{print $2}')
          if [ -z "$found" ]; then
            echo "::error::Couldn't read the server's host key (wrong VPS_HOST or VPS_PORT, or SSH not reachable)."
            exit 1
          fi
          # keep only the key(s) whose fingerprint matches
          : > ~/.ssh/known_hosts
          while read -r line; do
            fp=$(echo "$line" | ssh-keygen -lf - 2>/dev/null | awk '{print $2}')
            if [ "$fp" = "SHA256:${want#SHA256:}" ]; then echo "$line" >> ~/.ssh/known_hosts; fi
          done < <(grep -v '^#' ~/.ssh/scanned)
          if ! grep -q . ~/.ssh/known_hosts; then
            echo "::error::The server's host key doesn't match VPS_KNOWN_HOSTS. It shows: $(echo $found | tr '\n' ' ')"
            exit 1
          fi

      # Says why SSH fails, as annotations on the run (readable even when the logs aren't)
      - name: Check SSH
        run: |
          if ! fp=$(ssh-keygen -lf ~/.ssh/id_deploy 2>&1); then
            echo "::error::VPS_SSH_KEY is not a valid private key ($fp). Paste the whole file, BEGIN and END lines included."
            exit 1
          fi
          echo "::notice::Deploy key in VPS_SSH_KEY: $fp. On the VPS, 'ssh-keygen -lf ~deploy/.ssh/authorized_keys' must list the same SHA256."
          if out=$(ssh -o BatchMode=yes -o ConnectTimeout=20 vps true 2>&1); then
            echo "SSH works"
            exit 0
          fi
          case "$out" in
            *"Host key verification failed"*|*"No ED25519 host key is known"*|*"host key for"*)
              hint="VPS_KNOWN_HOSTS doesn't match the server. Put the server's fingerprint (SHA256:…) in it." ;;
            *"Permission denied"*)
              hint="The server refuses this key for VPS_USER. Its .pub must be in that user's ~/.ssh/authorized_keys (compare the SHA256 above)." ;;
            *"Could not resolve hostname"*)
              hint="VPS_HOST doesn't resolve. Use the plain IP or hostname (no user@, no ssh://)." ;;
            *"Connection refused"*)
              hint="Nothing listens for SSH on that port. Check VPS_PORT." ;;
            *"timed out"*)
              hint="GitHub can't reach the server. A firewall or fail2ban may only allow your own IP." ;;
            *) hint="See the SSH error." ;;
          esac
          echo "::error::SSH to the VPS failed. $hint SSH said: $(echo "$out" | tr '\n' ' ' | cut -c1-300)"
          exit 1

      - name: Copy compose files
        run: |
          ssh vps "mkdir -p '$DEPLOY_PATH'"
          scp docker-compose.yml docker-compose.boardpass.yml "vps:$DEPLOY_PATH/"
          ssh vps "test -f '$DEPLOY_PATH/.env'" || { echo "::error::$DEPLOY_PATH/.env is missing on the VPS (copy .env.example and fill it in)"; exit 1; }

      - name: Pull and restart
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | ssh vps \
            "docker login ghcr.io -u '${{ github.actor }}' --password-stdin >/dev/null"
          ssh vps "cd '$DEPLOY_PATH' \
            && export BOTC_IMAGE='${{ env.IMAGE }}:${{ github.sha }}' \
            && docker compose pull botc \
            && docker compose up -d --no-build --wait --wait-timeout 120"
          ssh vps "docker logout ghcr.io >/dev/null; docker image prune -f >/dev/null"

      - name: Check the VPS runs this commit
        run: |
          health=$(ssh vps "cd '$DEPLOY_PATH' && docker compose exec -T botc sh -c 'wget -qO- \"http://127.0.0.1:3000\${BASE_PATH}/health\"'")
          echo "$health"
          echo "$health" | grep -q '"version":"${{ github.sha }}"' || { echo "::error::the VPS answers with another version"; exit 1; }

      - name: Show container status
        if: always()
        run: ssh vps "cd '$DEPLOY_PATH' && docker compose ps && docker compose logs --tail 30 botc" || true
